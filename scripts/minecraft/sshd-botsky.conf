# Supplement existing AllowUsers without granting access from the public Internet.
AllowUsers botsky-mc@100.109.237.37
Match User botsky-mc
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /opt/botsky/mc-ctl.sh
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
Match all
