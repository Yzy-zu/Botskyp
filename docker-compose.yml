name: botsky
x-runtime: &runtime
  image: ${BOTSKY_IMAGE:-botsky:phase0}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '3'}
  environment: &environment
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    GEMINI_FREE_TIER_CONFIRMED: ${GEMINI_FREE_TIER_CONFIRMED:-false}
    WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-searxng}
    SEARXNG_URL: http://searxng:8080
    DATABASE_URL: ${DATABASE_URL:?required}
    EVOLUTION_URL: ${EVOLUTION_URL:?required}
    EVOLUTION_APIKEY: ${EVOLUTION_APIKEY:?required}
    INSTANCE: ${INSTANCE:?required}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:?required}
    OWNER_JIDS: ${OWNER_JIDS:?required}
    BOT_JIDS: ${BOT_JIDS:?required}
    LAB_CHAT_ID: ${LAB_CHAT_ID:?required}
    TRANSPORT: ${TRANSPORT:-mock}
    STALE_SECONDS: ${STALE_SECONDS:-120}
    TZ_DEFAULT: ${TZ_DEFAULT:-America/Mexico_City}
    CAPTURE_ENABLED: ${CAPTURE_ENABLED:-false}
  depends_on:
    postgres: {condition: service_healthy}
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?required}
      FORCE_OWNERSHIP: 'false'
      SEARXNG_LIMITER: 'false'
    volumes:
      - ./config/searxng.yml:/etc/searxng/settings.yml:ro
    networks: [internal, search-egress]
    mem_limit: 256m
    cpus: '0.20'
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=3)']
      interval: 10s
      timeout: 4s
      retries: 6
  capture:
    profiles: [capture]
    image: node:20-bookworm
    container_name: botsky-capture
    command: [node, /capture.mjs]
    user: '1002:1002'
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      FORWARD_URL: ${CAPTURE_FORWARD_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?required}
      LAB_CHAT_ID: ${LAB_CHAT_ID:?required}
      OWNER_JIDS: ${OWNER_JIDS:?required}
    volumes:
      - ./scripts/capture.mjs:/capture.mjs:ro
      - ./.local/captures:/captures
    networks: [evolution]
    mem_limit: 128m
    cpus: '0.10'
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3001/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 3s
      retries: 5
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botsky
      POSTGRES_DB: botsky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - botsky_pgdata:/var/lib/postgresql/data
    networks:
      internal:
        aliases: [botsky-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U botsky -d botsky']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: '0.20'
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  app:
    <<: *runtime
    build: .
    container_name: botsky-app
    ports: ['127.0.0.1:${BIND_PORT:-3000}:3000']
    networks: [internal, evolution]
    environment:
      <<: *environment
      MINECRAFT_ENABLED: ${MINECRAFT_ENABLED:-false}
    volumes: ['./.local/captures:/app/captures', './.local/minecraft:/run/botsky-minecraft:ro']
    mem_limit: 256m
    cpus: '0.25'
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 4s
      retries: 12
  worker:
    <<: *runtime
    container_name: botsky-worker
    command: [node, dist/src/worker.js]
    environment:
      <<: *environment
      CAPTURE_ENABLED: 'false'
    networks: [internal]
    mem_limit: 768m
    cpus: '0.50'
    healthcheck:
      test: [CMD, node, dist/src/worker-health.js]
      interval: 10s
      timeout: 4s
      retries: 6
volumes:
  botsky_pgdata:
networks:
  search-egress:
  internal:
    internal: true
  evolution:
    external: true
    name: evolution_evolution_net
